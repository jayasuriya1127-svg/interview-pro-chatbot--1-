<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InterviewPro — Interview Prep Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --paper: #edebe2;
    --paper-deep: #e4e1d4;
    --rule: #d5d0bd;
    --margin-line: #b7503f;
    --ink: #1f2a44;
    --ink-soft: #5b6579;
    --accent: #c98a2c;
    --accent-deep: #9c6b1f;
    --user-bg: #1f2a44;
    --user-fg: #f2efe4;
    --error: #a23b2e;
    --radius: 3px;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--paper-deep);
    font-family: "IBM Plex Mono", monospace;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .page {
    width: 100%;
    max-width: 640px;
    height: min(860px, 92vh);
    background: var(--paper);
    border: 1px solid var(--rule);
    box-shadow: 0 1px 0 rgba(31, 42, 68, 0.04), 0 18px 40px -24px rgba(31, 42, 68, 0.35);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* left red margin rule, like a legal pad */
  .page::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 54px;
    width: 1px;
    background: var(--margin-line);
    opacity: 0.55;
    z-index: 1;
  }

  header {
    padding: 26px 28px 20px 72px;
    border-bottom: 1px solid var(--rule);
    position: relative;
    z-index: 2;
  }

  .tab {
    position: absolute;
    top: 0;
    left: 0;
    background: var(--accent);
    color: var(--paper);
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.02em;
    padding: 5px 12px;
    border-bottom-right-radius: var(--radius);
  }

  h1 {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 26px;
    margin: 14px 0 4px;
    color: var(--ink);
  }

  header p {
    margin: 0;
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px 24px 72px;
    position: relative;
    z-index: 2;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 30px,
      var(--rule) 31px
    );
    background-position: 0 6px;
  }

  .msg {
    max-width: 92%;
    margin-bottom: 18px;
    line-height: 1.55;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: rise 0.25s ease;
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(4px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .msg .label {
    display: block;
    font-family: "Fraunces", serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }

  .msg.bot {
    color: var(--ink);
  }

  .msg.bot .label {
    color: var(--accent-deep);
  }

  .msg.bot .bubble {
    border-left: 2px solid var(--accent);
    padding-left: 12px;
  }

  .msg.user {
    margin-left: auto;
  }

  .msg.user .label {
    color: var(--ink-soft);
    text-align: right;
  }

  .msg.user .bubble {
    background: var(--user-bg);
    color: var(--user-fg);
    padding: 10px 14px;
    border-radius: var(--radius);
  }

  .msg.error .bubble {
    border-left: 2px solid var(--error);
    padding-left: 12px;
    color: var(--error);
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding-left: 12px;
    border-left: 2px solid var(--accent);
  }

  .typing span {
    width: 5px;
    height: 5px;
    background: var(--accent-deep);
    border-radius: 50%;
    animation: blink 1.1s infinite ease-in-out;
  }

  .typing span:nth-child(2) {
    animation-delay: 0.15s;
  }
  .typing span:nth-child(3) {
    animation-delay: 0.3s;
  }

  @keyframes blink {
    0%, 80%, 100% {
      opacity: 0.25;
    }
    40% {
      opacity: 1;
    }
  }

  form {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    padding: 16px 28px 20px 72px;
    border-top: 1px solid var(--rule);
    background: var(--paper);
    position: relative;
    z-index: 2;
  }

  textarea {
    flex: 1;
    resize: none;
    border: none;
    border-bottom: 1px solid var(--ink-soft);
    background: transparent;
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    color: var(--ink);
    padding: 6px 2px;
    max-height: 120px;
    line-height: 1.5;
  }

  textarea:focus {
    outline: none;
    border-bottom-color: var(--accent-deep);
  }

  textarea::placeholder {
    color: var(--ink-soft);
    opacity: 0.7;
  }

  button {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 14px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 10px 18px;
    cursor: pointer;
    border-radius: var(--radius);
    transition: background 0.15s ease, transform 0.05s ease;
  }

  button:hover:not(:disabled) {
    background: var(--accent-deep);
  }

  button:active:not(:disabled) {
    transform: scale(0.97);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .chat::-webkit-scrollbar {
    width: 8px;
  }
  .chat::-webkit-scrollbar-thumb {
    background: var(--rule);
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .msg, .typing span {
      animation: none;
    }
  }

  @media (max-width: 480px) {
    header, .chat, form {
      padding-left: 40px;
    }
    .page::before {
      left: 26px;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <span class="tab">STUDY SESSION</span>
      <h1>InterviewPro</h1>
      <p>Your focused prep partner for interview questions, mock rounds, and the concepts behind them.</p>
    </header>

    <div class="chat" id="chat" aria-live="polite"></div>

    <form id="chat-form">
      <textarea
        id="input"
        rows="1"
        placeholder="Ask about an interview question, topic, or request a mock round..."
        autofocus
      ></textarea>
      <button id="send-btn" type="submit">Send</button>
    </form>
  </div>

  <script>
    const chatEl = document.getElementById("chat");
    const formEl = document.getElementById("chat-form");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send-btn");

    // Client-side history kept in memory only (role + text)
    const history = [];

    function scrollToBottom() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function addMessage(role, text) {
      const wrapper = document.createElement("div");
      wrapper.className = "msg " + role;

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = role === "user" ? "You" : role === "error" ? "Notice" : "InterviewPro";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      wrapper.appendChild(label);
      wrapper.appendChild(bubble);
      chatEl.appendChild(wrapper);
      scrollToBottom();
      return wrapper;
    }

    function addTypingIndicator() {
      const wrapper = document.createElement("div");
      wrapper.className = "msg bot";
      wrapper.id = "typing-indicator";

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = "InterviewPro";

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.innerHTML = "<span></span><span></span><span></span>";

      wrapper.appendChild(label);
      wrapper.appendChild(typing);
      chatEl.appendChild(wrapper);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const el = document.getElementById("typing-indicator");
      if (el) el.remove();
    }

    function autoResize() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
    }

    inputEl.addEventListener("input", autoResize);

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        formEl.requestSubmit();
      }
    });

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = inputEl.value.trim();
      if (!message) return;

      addMessage("user", message);
      history.push({ role: "user", text: message });

      inputEl.value = "";
      autoResize();
      inputEl.disabled = true;
      sendBtn.disabled = true;
      addTypingIndicator();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            history: history.slice(0, -1), // prior turns, excluding the one just sent
          }),
        });

        const data = await res.json();
        removeTypingIndicator();

        if (!res.ok) {
          addMessage("error", data.error || "Something went wrong. Please try again.");
        } else {
          addMessage("bot", data.reply);
          history.push({ role: "bot", text: data.reply });
        }
      } catch (err) {
        removeTypingIndicator();
        addMessage("error", "Could not reach the server. Please check your connection.");
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    });

    // Greet the user on load
    addMessage(
      "bot",
      "Hi, I'm InterviewPro. Ask me an interview question, request a mock round, or bring up a concept you want to study before your interview."
    );
  </script>
</body>
</html>
